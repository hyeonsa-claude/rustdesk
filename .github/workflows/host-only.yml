name: Host-only Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        default: "host-1.5.3"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}
